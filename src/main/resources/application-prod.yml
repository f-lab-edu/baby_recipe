spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/babyrecipe?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.babyrecipe: INFO
    org.springframework.security: WARN
  file:
    name: logs/app.log
