spring:
  datasource:
    url: jdbc:mysql://localhost:3306/baby_recipe?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:babyrecipe-secret-key-must-be-at-least-256-bits-long-for-hs256}
  access-token-expiry: 3600000       # 1 hour (ms)
  refresh-token-expiry: 604800000    # 7 days (ms)

app:
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    com.babyrecipe: DEBUG
    org.springframework.security: WARN
